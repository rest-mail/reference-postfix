name: build

# Images are versioned with SemVer, from a git tag: pushing v1.2.3 publishes
# ghcr.io/<repo>:1.2.3. Anything that deploys or tests against this image
# names one of those versions. A push to master publishes only `latest` and the
# commit's short sha, for trying a change before it is released; neither is a
# version and nothing should pin them.
#
# There were date-based (CalVer) tags here before. They are gone, and none
# should be made again: a date says when, not what changed or whether it is safe
# to take.
#
# The build is rest-mail/deploy's image.yml, the one every rest-mail image
# shares, so versioning, publishing and the HEALTHCHECK check cannot drift
# between repositories. A pull request builds and checks the image but
# publishes nothing.

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions: {}

jobs:
  image:
    # The most image.yml asks for. Its validate job narrows this to
    # contents: read; only its publish job, on a trusted run, uses packages.
    permissions:
      contents: read
      packages: write
    uses: rest-mail/deploy/.github/workflows/image.yml@04cd88fdbe32848e9016ffb2aeef370b8631229d # rest-mail/deploy#8
